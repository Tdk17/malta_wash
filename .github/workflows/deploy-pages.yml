name: Deploy Malta Wash to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        env:
          PARSE_SERVER_URL: ${{ vars.PARSE_SERVER_URL }}
          PARSE_APPLICATION_ID: ${{ vars.PARSE_APPLICATION_ID }}
          PARSE_CLIENT_KEY: ${{ vars.PARSE_CLIENT_KEY }}
        run: |
          PARSE_SERVER_URL="${PARSE_SERVER_URL:-https://parseapi.back4app.com}"
          flutter build web --release \
            --base-href "/malta_wash/" \
            --dart-define=APP_ENV=production \
            --dart-define=PARSE_SERVER_URL="$PARSE_SERVER_URL" \
            --dart-define=PARSE_APPLICATION_ID="$PARSE_APPLICATION_ID" \
            --dart-define=PARSE_CLIENT_KEY="$PARSE_CLIENT_KEY"

      - name: Validate Back4App client configuration
        env:
          PARSE_APPLICATION_ID: ${{ vars.PARSE_APPLICATION_ID }}
          PARSE_CLIENT_KEY: ${{ vars.PARSE_CLIENT_KEY }}
        run: |
          test -n "$PARSE_APPLICATION_ID" || { echo "::error::Configure PARSE_APPLICATION_ID em Settings > Secrets and variables > Actions > Variables."; exit 1; }
          test -n "$PARSE_CLIENT_KEY" || { echo "::error::Configure PARSE_CLIENT_KEY em Settings > Secrets and variables > Actions > Variables."; exit 1; }

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
